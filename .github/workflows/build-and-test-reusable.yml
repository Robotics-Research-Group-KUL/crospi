name: Build and Test (reusable)

# Builds the crospi packages for one ROS 2 distribution in the official ros:<distro>-ros-base image.
# All build dependencies are declared in the package.xml files and installed by rosdep (through action-ros-ci),
# so no custom build image is needed.
#
# Called by one small workflow per distribution (build-and-test-ros2-<distro>.yml), so that every distribution has
# its own status badge (GitHub badges are per workflow, not per matrix job). To support a new distribution, copy one
# of those files and change the distribution name; the build steps are only defined here.

on:
  workflow_call:
    inputs:
      distro:
        description: ROS 2 distribution to build for (e.g. jazzy)
        required: true
        type: string

permissions:
  contents: read

env:
  # MuJoCo for mujoco_robotsimulator_crospi (no rosdep key): its python package ships the headers and libmujoco.so.
  # Keep in sync with MUJOCO_VERSION in containers/Containerfile. (MuJoCo 4 dropped Python 3.10, i.e. Ubuntu 22.04.)
  MUJOCO_VERSION: "3.16.0"
  # Build-time only: pip >= 23 refuses system-wide installs on Ubuntu >= 24.04 without this; older pip ignores it
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  build_and_test:
    name: ROS 2 ${{ inputs.distro }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ inputs.distro }}-ros-base

    steps:
      - name: Install build tools and refresh the package indexes
        # The official ROS images ship without apt lists; action-ros-ci does not refresh them nor the rosdep cache
        run: |
          apt-get update
          apt-get install -y ros-dev-tools python3-pip
          rosdep update --rosdistro ${{ inputs.distro }}

      - name: Install MuJoCo
        run: pip3 install "mujoco==${MUJOCO_VERSION}"

      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub token for HTTPS cloning
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: etasl_wrapper crospi_interfaces crospi_core crospi_default_plugins template_driver_crospi mujoco_robotsimulator_crospi
          # Additional repositories (e.g. mujoco_robotsimulator_crospi) cloned into the workspace
          vcs-repo-file-url: .github/ci.repos
          target-ros2-distro: ${{ inputs.distro }}
          skip-tests: true
          coverage-result: false
